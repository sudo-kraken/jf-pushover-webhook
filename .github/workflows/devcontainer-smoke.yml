# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Devcontainer Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Test Dev Container
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Build and verify devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            bash -lc '
              set -euo pipefail

              echo "User check"
              id -un | grep -qx vscode

              echo "PATH check"
              echo "$PATH" | grep -q "/usr/local/bin"

              echo "uv and Python"
              command -v uv >/dev/null
              uv --version
              python --version
              python -c "import sys; assert sys.version_info[:2] == (3, 13)"
              uv run -q python -V
              uv run ruff --version
              uv run pytest --version

              echo "Docker client present"
              command -v docker >/dev/null

              echo "Docker socket check"
              test -S /var/run/docker-host.sock
              test -S /var/run/docker.sock
              docker version >/dev/null
              echo "Docker socket available and working for vscode"

              echo "OK: devcontainer is healthy"
            '
