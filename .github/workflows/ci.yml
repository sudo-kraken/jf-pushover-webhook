---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Continuous Integration

on:
  - pull_request

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.7"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Check uv lock
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Run ruff format
        run: uv run ruff format --check .

      - name: Run ruff check
        run: uv run ruff check .

  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.7"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Verify selected Python
        run: >-
          uv run python -c
          "import sys; expected = tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          assert sys.version_info[:2] == expected, (sys.version, expected)"

      - name: Run tests
        run: uv run pytest

  container:
    name: Production container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag jf-pushover-webhook:test .

      - name: Smoke test production image
        run: |
          docker run --detach --name jf-pushover-webhook \
            --publish 127.0.0.1:18484:8484 \
            --env AUTH_TOKEN=test-auth-token \
            --env PUSHOVER_API_TOKEN=test-api-token \
            --env PUSHOVER_USER_KEY=test-user-key \
            jf-pushover-webhook:test

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18484/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs jf-pushover-webhook
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm --force jf-pushover-webhook || true
